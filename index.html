<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Reyes Tham</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@300;400;500&family=Inter:wght@300;400;500&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#fff;--text:#0a0a0a;--muted:#999;--faint:#f5f5f5;--border:#e8e8e8;
  --u:'Unbounded',sans-serif;--i:'Inter',sans-serif;
}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:var(--i);font-weight:300;overflow-x:hidden;cursor:none}

/* CURSOR */
.cursor{position:fixed;top:0;left:0;width:8px;height:8px;background:var(--text);border-radius:50%;pointer-events:none;z-index:9999;transform:translate(-50%,-50%);display:flex;align-items:center;justify-content:center;transition:width .25s ease,height .25s ease,opacity .2s ease,background .25s ease}
.cursor-label{font-family:var(--i);font-size:.55rem;font-weight:500;letter-spacing:.16em;text-transform:uppercase;color:#fff;opacity:0;transition:opacity .15s ease;white-space:nowrap}
.cursor-ring{position:fixed;top:0;left:0;width:32px;height:32px;border:1px solid rgba(10,10,10,.2);border-radius:50%;pointer-events:none;z-index:9998;transform:translate(-50%,-50%);transition:opacity .2s ease}
/* state: hovering a link / button — expand */
.cursor.is-link{width:26px;height:26px}
/* state: hovering a clickable case study — expand + VIEW */
.cursor.is-view{width:76px;height:76px;background:var(--text)}
.cursor.is-view .cursor-label{opacity:1}
/* state: hovering imagery — invert */
.cursor.is-invert{width:56px;height:56px;background:#fff;mix-blend-mode:difference}
/* state: hovering text — disappear */
.cursor.is-text{opacity:0;width:4px;height:4px}
.cursor.is-view~.cursor-ring,.cursor.is-invert~.cursor-ring,.cursor.is-text~.cursor-ring{opacity:0}
.cursor.is-link~.cursor-ring{opacity:.35}
/* native text caret shows where the custom cursor disappears */
p,h1,h2,h3,h4,h5,h6,li,blockquote{cursor:text}
.cs-card[data-href],.cs-card[data-href] *{cursor:none}
a,button,a *,button *{cursor:none}
@media(hover:none),(pointer:coarse){.cursor,.cursor-ring{display:none!important}body{cursor:auto}a,button,a *,button *{cursor:pointer}}

/* NAV */
nav{position:fixed;top:0;left:0;right:0;z-index:900;display:flex;align-items:center;justify-content:space-between;padding:1.6rem 3.5rem;background:rgba(255,255,255,.9);backdrop-filter:blur(16px);border-bottom:1px solid var(--border)}
.nav-logo{font-family:var(--u);font-size:.72rem;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--text);text-decoration:none}
.nav-links{display:flex;gap:2.5rem}
.nav-links a{font-family:var(--i);font-size:.72rem;font-weight:400;color:var(--muted);text-decoration:none;transition:color .2s}
.nav-links a:hover{color:var(--text)}

/* HERO */
#home{min-height:100vh;display:flex;flex-direction:column;justify-content:space-between;padding:9rem 3.5rem 3.5rem;border-bottom:1px solid var(--border)}
.hero-eyebrow{font-family:var(--i);font-size:.7rem;font-weight:400;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:2.5rem}
.hero-headline{font-family:var(--u);font-size:clamp(2rem,6.4vw,6.2rem);font-weight:300;line-height:1.08;letter-spacing:-.03em;color:var(--text);max-width:16ch}
.hero-subline{font-family:var(--i);font-size:clamp(.9rem,1.5vw,1.1rem);line-height:1.8;color:#555;font-weight:300;max-width:52ch;margin-top:2.2rem}
.hero-bottom{display:flex;align-items:flex-end;justify-content:space-between;padding-top:2.5rem;border-top:1px solid var(--border);flex-wrap:wrap;gap:1.5rem;margin-top:3rem}
.hero-pills{display:flex;flex-wrap:wrap;gap:.5rem}
.hero-pill{font-family:var(--i);font-size:.7rem;font-weight:400;color:var(--muted);border:1px solid var(--border);border-radius:2rem;padding:.4rem .9rem}
.hero-scroll{display:flex;align-items:center;gap:.8rem;font-family:var(--i);font-size:.65rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.hero-scroll-line{width:28px;height:1px;background:var(--muted);animation:lineAnim 2s ease infinite}
@keyframes lineAnim{0%,100%{width:18px;opacity:.4}50%{width:36px;opacity:1}}

/* SECTION */
section{padding:7rem 3.5rem;border-top:1px solid var(--border)}
.section-header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:4.5rem;gap:2rem;flex-wrap:wrap}
.section-num{font-family:var(--i);font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding-top:.3rem}
h2.section-title{font-family:var(--u);font-size:clamp(1.6rem,4vw,3.5rem);font-weight:300;letter-spacing:-.025em;line-height:1.1;text-align:right}

/* CASE STUDIES */
.cs-stack{display:flex;flex-direction:column;gap:3rem}
.cs-card{border:1px solid var(--border);border-radius:4px;background:#fff;overflow:hidden;transition:box-shadow .3s ease,transform .3s ease}
.cs-card[data-href]:hover{box-shadow:0 18px 50px -24px rgba(0,0,0,.25);transform:translateY(-3px)}
.cs-top{padding:2.6rem 2.6rem 0;display:grid;grid-template-columns:1fr auto;gap:2rem;align-items:start}
.cs-meta{display:flex;align-items:center;gap:1.2rem;margin-bottom:1.4rem}
.cs-num{font-family:var(--u);font-size:.7rem;font-weight:400;color:var(--muted);letter-spacing:.1em}
.cs-tag{font-family:var(--i);font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.cs-year{font-family:var(--i);font-size:.7rem;color:var(--muted);text-align:right;padding-top:.2rem;white-space:nowrap}
.cs-title{font-family:var(--u);font-size:clamp(1.3rem,3.2vw,2.4rem);font-weight:300;letter-spacing:-.02em;line-height:1.15;margin-bottom:1.4rem}
.cs-summary{font-family:var(--i);font-size:.88rem;line-height:1.85;color:#555;font-weight:300;max-width:62ch}
.cs-outcome{font-family:var(--i);font-size:.82rem;line-height:1.7;color:var(--text);font-weight:400;max-width:62ch;margin-top:1.1rem;padding-left:1rem;border-left:2px solid var(--text)}
.cs-footer{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:1rem;margin-top:1.8rem}
.cs-chips{display:flex;flex-wrap:wrap;gap:.45rem}
.cs-chip{font-family:var(--i);font-size:.66rem;color:var(--muted);border:1px solid var(--border);border-radius:2rem;padding:.32rem .75rem}
.cs-link{display:inline-flex;align-items:center;gap:.5rem;font-family:var(--i);font-size:.72rem;font-weight:500;color:var(--text);text-decoration:none;border:1px solid var(--border);border-radius:2rem;padding:.45rem 1rem;transition:background .2s,border-color .2s,color .2s;white-space:nowrap}
.cs-link:hover{background:var(--text);color:#fff;border-color:var(--text)}
/* media strip: image + video cards */
.cs-media{display:flex;gap:1rem;overflow-x:auto;padding:2.2rem 2.6rem 2.6rem;scrollbar-width:thin}
.cs-media-card{flex:0 0 auto;width:min(430px,72vw);border:1px solid var(--border);border-radius:4px;overflow:hidden;background:var(--faint)}
.cs-media-card img,.cs-media-card video,.cs-media-card iframe{width:100%;aspect-ratio:16/10;object-fit:cover;display:block;border:none;background:#000}
.cs-media-cap{display:flex;align-items:center;justify-content:space-between;gap:1rem;font-family:var(--i);font-size:.66rem;color:var(--muted);padding:.6rem .85rem;background:#fff;border-top:1px solid var(--border)}
.cs-media-type{letter-spacing:.12em;text-transform:uppercase;font-size:.58rem;flex-shrink:0}
.cs-placeholder{flex:0 0 auto;width:min(430px,72vw);aspect-ratio:16/10;border:1px solid var(--border);border-radius:4px;background:var(--faint);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.8rem}
.cs-placeholder span{font-family:var(--u);font-size:3.4rem;font-weight:300;color:#ddd;letter-spacing:-.03em}
.cs-placeholder small{font-family:var(--i);font-size:.62rem;letter-spacing:.14em;text-transform:uppercase;color:#ccc}

/* ARCHIVE */
.archive-label{font-family:var(--i);font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:4.5rem 0 1.5rem}
.archive-row{display:grid;grid-template-columns:1fr auto auto;align-items:baseline;gap:2rem;padding:1.3rem 0;border-bottom:1px solid var(--border);text-decoration:none;color:inherit}
.archive-row:first-of-type{border-top:1px solid var(--border)}
.archive-title{font-family:var(--u);font-size:clamp(.76rem,1.6vw,.95rem);font-weight:300}
.archive-desc{font-family:var(--i);font-size:.74rem;line-height:1.7;color:#888;font-weight:300;max-width:70ch;grid-column:1/-1;margin-top:.35rem}
.archive-year{font-family:var(--i);font-size:.7rem;color:var(--muted)}
.archive-arrow{font-size:.8rem;color:var(--muted);transition:transform .25s,color .2s}
a.archive-row:hover .archive-arrow{transform:translate(3px,-3px);color:var(--text)}

/* CAPABILITIES */
.cap-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:0;border:1px solid var(--border);border-radius:4px;overflow:hidden}
.cap-group{padding:2.4rem 2.2rem;border-right:1px solid var(--border);border-bottom:1px solid var(--border);margin-right:-1px;margin-bottom:-1px;background:#fff}
.cap-index{font-family:var(--i);font-size:.62rem;letter-spacing:.14em;color:var(--muted);margin-bottom:1.2rem}
.cap-name{font-family:var(--u);font-size:.92rem;font-weight:400;letter-spacing:-.01em;margin-bottom:1.4rem;line-height:1.35}
.cap-items{list-style:none}
.cap-items li{font-family:var(--i);font-size:.78rem;line-height:1.7;color:#555;font-weight:300;padding:.5rem 0;border-bottom:1px solid var(--faint)}
.cap-items li:last-child{border-bottom:none}

/* ABOUT */
.about-grid{display:grid;grid-template-columns:260px 1fr;gap:6rem;align-items:start}
.about-meta{display:flex;flex-direction:column}
.about-meta-item{padding:1.1rem 0;border-bottom:1px solid var(--border)}
.about-meta-item:first-child{border-top:1px solid var(--border)}
.about-meta-item label{display:block;font-family:var(--i);font-size:.63rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:.3rem}
.about-meta-item span{font-family:var(--i);font-size:.82rem;line-height:1.5}
.about-body{font-family:var(--i);font-size:clamp(.95rem,1.6vw,1.15rem);line-height:1.9;color:#444;font-weight:300}

/* LIST ROWS (achievements) */
.list-table{display:flex;flex-direction:column}
.list-row{border-bottom:1px solid var(--border);position:relative;overflow:hidden}
.list-row:first-child{border-top:1px solid var(--border)}
.list-row-header{display:grid;grid-template-columns:1fr 100px 28px;align-items:center;gap:2rem;padding:1.6rem 0;position:relative;z-index:1}
.row-title{font-family:var(--u);font-size:clamp(.78rem,1.8vw,1.05rem);font-weight:300;letter-spacing:-.01em}
.row-meta{font-family:var(--i);font-size:.7rem;color:var(--muted)}
.row-toggle{font-size:.85rem;color:var(--muted);transition:transform .3s,color .2s;line-height:1;user-select:none}
.list-row:hover .row-toggle{color:var(--text)}
.list-row.open .row-toggle{transform:rotate(45deg);color:var(--text)}
.list-expand{max-height:0;overflow:hidden;transition:max-height .4s cubic-bezier(0.4,0,0.2,1)}
.list-expand-inner{padding:0 0 1.8rem;display:flex;align-items:flex-start;gap:2rem;flex-wrap:wrap}
.expand-desc{font-family:var(--i);font-size:.85rem;line-height:1.8;color:#555;font-weight:300;flex:1;min-width:240px}
.expand-link{display:inline-flex;align-items:center;gap:.5rem;font-family:var(--i);font-size:.72rem;font-weight:500;color:var(--text);text-decoration:none;border:1px solid var(--border);border-radius:2rem;padding:.45rem 1rem;transition:background .2s,border-color .2s;white-space:nowrap;align-self:flex-start;margin-top:.25rem}
.expand-link:hover{background:var(--text);color:#fff;border-color:var(--text)}

/* CLUBS */
.clubs-stack{display:flex;flex-direction:column}
.club-block{display:grid;grid-template-columns:1fr 1fr;gap:5rem;align-items:start;padding:5rem 0;border-bottom:1px solid var(--border)}
.club-block:first-child{border-top:1px solid var(--border)}
.carousel{overflow:hidden;border-radius:3px;aspect-ratio:3/2;background:var(--faint)}
.carousel-slides{display:flex;transition:transform .55s cubic-bezier(0.4,0,0.2,1);height:100%}
.carousel-slides img,.carousel-slides video{width:100%;flex-shrink:0;height:100%;object-fit:cover}
.carousel-dots{display:flex;gap:.4rem;margin-top:.8rem}
.carousel-dot{width:16px;height:2px;background:var(--border);border:none;cursor:pointer;border-radius:2px;transition:background .2s,width .25s}
.carousel-dot.active{background:var(--text);width:28px}
.club-name{font-family:var(--u);font-size:clamp(1.1rem,2.5vw,1.9rem);font-weight:300;letter-spacing:-.02em;margin-bottom:1.8rem;line-height:1.2}
.club-roles{display:flex;flex-direction:column;margin-bottom:2rem}
.club-role{display:flex;align-items:baseline;gap:1.2rem;padding:.65rem 0;border-bottom:1px solid var(--border)}
.club-role:first-child{border-top:1px solid var(--border)}
.club-role-title{font-family:var(--i);font-size:.78rem;font-weight:500}
.club-role-period{font-family:var(--i);font-size:.7rem;color:var(--muted)}
.club-desc{font-family:var(--i);font-size:.82rem;line-height:1.85;color:#555;font-weight:300;white-space:pre-line}

/* CONTACT */
#contact{min-height:85vh;display:flex;flex-direction:column;justify-content:center}
.contact-heading{font-family:var(--u);font-size:clamp(2rem,7vw,6.5rem);font-weight:300;letter-spacing:-.03em;line-height:1.05;margin-bottom:2rem}
.contact-blurb{font-family:var(--i);font-size:clamp(.88rem,1.5vw,1.05rem);line-height:1.85;color:#555;font-weight:300;max-width:54ch;margin-bottom:4rem}
.contact-rows{display:flex;flex-direction:column}
.contact-row{display:grid;grid-template-columns:140px 1fr auto;align-items:center;gap:2rem;padding:1.7rem 0;border-bottom:1px solid var(--border);text-decoration:none;color:inherit;transition:padding-left .25s ease}
.contact-row:first-child{border-top:1px solid var(--border)}
.contact-row:hover{padding-left:.8rem}
.contact-row-label{font-family:var(--i);font-size:.65rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.contact-row-value{font-family:var(--u);font-size:clamp(.8rem,2vw,1.15rem);font-weight:300;letter-spacing:-.01em;word-break:break-all}
.contact-row-arrow{font-size:1rem;color:var(--muted);transition:transform .25s,color .2s}
.contact-row:hover .contact-row-arrow{transform:translate(4px,-4px);color:var(--text)}

/* FOOTER */
footer{border-top:1px solid var(--border);padding:2.5rem 3.5rem;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:1.5rem}
.footer-brand{font-family:var(--u);font-size:.7rem;font-weight:500;letter-spacing:.08em;text-transform:uppercase}
.footer-links{display:flex;gap:2rem}
.footer-links a{font-family:var(--i);font-size:.7rem;color:var(--muted);text-decoration:none;transition:color .2s}
.footer-links a:hover{color:var(--text)}
.footer-copy{font-family:var(--i);font-size:.65rem;color:#bbb}

/* REVEAL */
.reveal{opacity:0;transform:translateY(18px);transition:opacity .6s ease,transform .6s ease}
.reveal.visible{opacity:1;transform:none}
.d1{transition-delay:.08s}.d2{transition-delay:.16s}.d3{transition-delay:.24s}.d4{transition-delay:.32s}

/* LOADING */
.loading-screen{position:fixed;inset:0;background:#fff;display:flex;align-items:center;justify-content:center;z-index:9000;transition:opacity .4s ease}
.loading-screen.hidden{opacity:0;pointer-events:none}
.loading-dot{width:6px;height:6px;background:var(--text);border-radius:50%;animation:ldot .8s ease infinite alternate}
@keyframes ldot{from{opacity:.2;transform:scale(.8)}to{opacity:1;transform:scale(1.2)}}

@media(max-width:860px){
  nav{padding:1.1rem 1.5rem}
  .nav-links{display:none}
  #home,section{padding-left:1.5rem;padding-right:1.5rem}
  .about-grid{grid-template-columns:1fr;gap:2.5rem}
  .club-block{grid-template-columns:1fr;gap:2rem}
  .list-row-header{grid-template-columns:1fr 28px}
  .row-meta{display:none}
  .cs-top{grid-template-columns:1fr;padding:1.6rem 1.6rem 0}
  .cs-year{text-align:left}
  .cs-media{padding:1.6rem}
  .archive-row{grid-template-columns:1fr auto}
  .archive-arrow{display:none}
  .contact-row{grid-template-columns:1fr auto}
  .contact-row-label{display:none}
  footer{flex-direction:column;align-items:flex-start}
  h2.section-title{text-align:left}
}
</style>
</head>
<body>

<div class="loading-screen" id="loadingScreen">
  <div class="loading-dot"></div>
</div>

<div class="cursor" id="cursor" style="visibility:hidden"><span class="cursor-label">View</span></div>
<div class="cursor-ring" id="cursorRing" style="visibility:hidden"></div>

<!-- NAV -->
<nav>
  <a href="#home" class="nav-logo" id="navLogo"></a>
  <div class="nav-links">
    <a href="#home">Home</a>
    <a href="#work">Work</a>
    <a href="#capabilities">Capabilities</a>
    <a href="#aboutme">About</a>
    <a href="#clubs">CCAs</a>
    <a href="#achievements">Awards</a>
    <a href="#contact">Contact</a>
  </div>
</nav>

<!-- HERO -->
<section id="home" style="border:none">
  <div>
    <p class="hero-eyebrow reveal" id="heroEyebrow"></p>
    <h1 class="hero-headline reveal d1" id="heroHeadline"></h1>
    <p class="hero-subline reveal d2" id="heroSubline"></p>
  </div>
  <div class="hero-bottom reveal d3">
    <div class="hero-pills" id="heroPills"></div>
    <div class="hero-scroll"><div class="hero-scroll-line"></div>Scroll</div>
  </div>
</section>

<!-- CASE STUDIES -->
<section id="work">
  <div class="section-header reveal">
    <span class="section-num">01 — Selected Work</span>
    <h2 class="section-title">Case<br>studies.</h2>
  </div>
  <div class="cs-stack" id="caseStudies"></div>
  <p class="archive-label reveal" id="archiveLabel">More projects</p>
  <div id="archiveList"></div>
</section>

<!-- CAPABILITIES -->
<section id="capabilities">
  <div class="section-header reveal">
    <span class="section-num">02 — Capabilities</span>
    <h2 class="section-title">What I<br>work with.</h2>
  </div>
  <div class="cap-grid reveal d1" id="capGrid"></div>
</section>

<!-- ABOUT -->
<section id="aboutme">
  <div class="section-header reveal">
    <span class="section-num">03 — About Me</span>
    <h2 class="section-title">A little<br>about me.</h2>
  </div>
  <div class="about-grid">
    <div class="about-meta reveal d1" id="aboutMeta"></div>
    <p class="about-body reveal d2" id="aboutBio"></p>
  </div>
</section>

<!-- CLUBS / CCAs -->
<section id="clubs">
  <div class="section-header reveal">
    <span class="section-num">04 — CCAs &amp; Societies</span>
    <h2 class="section-title">Leadership &amp;<br>community.</h2>
  </div>
  <div class="clubs-stack" id="clubsStack"></div>
</section>

<!-- ACHIEVEMENTS -->
<section id="achievements">
  <div class="section-header reveal">
    <span class="section-num">05 — Achievements</span>
    <h2 class="section-title">Recognition.</h2>
  </div>
  <div class="list-table" id="achievementsList"></div>
</section>

<!-- CONTACT -->
<section id="contact">
  <div class="section-header reveal">
    <span class="section-num">06 — Contact</span>
  </div>
  <h2 class="contact-heading reveal" id="contactHeading"></h2>
  <p class="contact-blurb reveal d1" id="contactBlurb"></p>
  <div class="contact-rows reveal d2" id="contactRows"></div>
</section>

<!-- FOOTER -->
<footer>
  <span class="footer-brand" id="footerBrand"></span>
  <div class="footer-links" id="footerLinks">
    <a href="#home">Top</a><a href="#work">Work</a><a href="#contact">Contact</a>
  </div>
  <span class="footer-copy" id="footerCopy"></span>
</footer>

<script>
/* ── INLINE DATA (fallback for local file:// opening) ── */

/* ── LOAD DATA ── */
/* Tries to fetch data.json (works on GitHub Pages / any server).
   Falls back to INLINE_DATA when opened as a local file. */
async function loadData() {
  let d;
  try {
    const res = await fetch('data.json?v=' + Date.now());
    if (!res.ok) throw new Error('not ok');
    d = await res.json();
  } catch(e) {
    d = INLINE_DATA;
  }
  return migrate(d);
}

/* Accepts the old schema (projects/techStack) and upgrades it in memory */
function migrate(d) {
  if (!d) return d;
  if (!d.caseStudies && Array.isArray(d.projects)) {
    d.caseStudies = d.projects.slice(0, 3).map(p => ({
      ...p, tag: '', summary: p.description || '', outcome: '', stack: [], media: []
    }));
    d.archive = d.projects.slice(3);
  }
  d.caseStudies = (d.caseStudies || []).map(c => ({ media: [], stack: [], ...c }));
  d.archive = d.archive || [];
  d.capabilities = d.capabilities || [];
  d.contact = d.contact || { heading: "Let's talk.", blurb: '', email: '', linkedin: '', github: '' };
  d.hero.headline = d.hero.headline || d.hero.name;
  d.hero.eyebrow = d.hero.eyebrow || `${d.hero.name} — Portfolio ${d.hero.year}`;
  d.hero.subline = d.hero.subline || '';
  return d;
}

/* ── HELPERS ── */
function esc(s=''){return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function isEmbed(src){return /youtube\.com|youtu\.be|vimeo\.com/.test(src)}
function embedUrl(src){
  let m = src.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/)([\w-]{6,})/);
  if (m) return `https://www.youtube.com/embed/${m[1]}`;
  m = src.match(/vimeo\.com\/(\d+)/);
  if (m) return `https://player.vimeo.com/video/${m[1]}`;
  return src;
}
function isVideoSrc(src){return src.startsWith('data:video') || /\.(mp4|webm|mov|m4v)(\?|$)/i.test(src)}

/* ── RENDER ── */

  // About
  const interestsDisplay = Array.isArray(d.about.interests)

/* ── ACHIEVEMENT ROWS ── */
function toggleRow(row) {
  const panel = row.querySelector('.list-expand');
  const inner = row.querySelector('.list-expand-inner');
  const isOpen = row.classList.contains('open');
  row.closest('.list-table').querySelectorAll('.list-row.open').forEach(r => {
    if (r !== row) {
      r.classList.remove('open');
      r.querySelector('.list-expand').style.maxHeight = '0';
    }
  });
  if (isOpen) {
    row.classList.remove('open');
    panel.style.maxHeight = '0';
  } else {
    row.classList.add('open');
    panel.style.maxHeight = inner.scrollHeight + 32 + 'px';
  }
}

/* ── CURSOR ──
   States: is-view   → expanded circle + "VIEW" over clickable case studies
           is-invert → inverted disc over imagery (img / video / carousels)
           is-text   → disappears over text (native caret shows instead)
           is-link   → gentle expansion over links & buttons               */
const cur = document.getElementById('cursor'), ring = document.getElementById('cursorRing');
let mx=0,my=0,rx=0,ry=0,seen=false;
document.addEventListener('mousemove', e => {
  mx=e.clientX; my=e.clientY;
  if (!seen) { seen=true; rx=mx; ry=my; cur.style.visibility='visible'; ring.style.visibility='visible'; }
});
(function tick(){
  cur.style.transform=`translate(${mx}px,${my}px) translate(-50%,-50%)`;
  rx+=(mx-rx)*0.12; ry+=(my-ry)*0.12;
  ring.style.transform=`translate(${rx}px,${ry}px) translate(-50%,-50%)`;
  requestAnimationFrame(tick);
})();
function cursorStateFor(el) {
  if (!el || !el.closest) return '';
  if (el.closest('img,video,iframe,.carousel,.cs-media-card,.cs-placeholder')) return 'is-invert';
  if (el.closest('.cs-card[data-href]')) return 'is-view';
  if (el.closest('a,button,.list-row,input,textarea,select')) return 'is-link';
  if (el.closest('p,h1,h2,h3,h4,h5,h6,li,blockquote')) return 'is-text';
  return '';
}
document.addEventListener('mouseover', e => {
  cur.className = 'cursor ' + cursorStateFor(e.target);
});

/* ── SCROLL REVEAL ── */
const obs = new IntersectionObserver(entries => {
  entries.forEach(e => { if (e.isIntersecting) e.target.classList.add('visible'); });
}, { threshold: 0.08 });
function observeAll() {
  document.querySelectorAll('.reveal').forEach(el => obs.observe(el));
}

/* ── CAROUSELS ── */
const carouselState = {};
function goTo(club, idx) {
  const c = document.querySelector(`.carousel[data-club="${club}"]`);
  if (!c) return;
  c.querySelector('.carousel-slides').style.transform = `translateX(-${idx * 100}%)`;
  document.querySelectorAll(`.carousel-dot[data-club="${club}"]`).forEach((d,i) => d.classList.toggle('active', i===idx));
  carouselState[club] = idx;
}
function bindCarousels() {
  document.querySelectorAll('.carousel-dot').forEach(d => {
    d.addEventListener('click', () => goTo(d.dataset.club, +d.dataset.index));
  });
  setInterval(() => {
    document.querySelectorAll('.carousel').forEach(c => {
      const club = c.dataset.club;
      const total = c.querySelectorAll('img,video').length;
      if (total > 1) goTo(club, ((carouselState[club]||0)+1) % total);
    });
  }, 4000);
}

/* ── INIT ── */
window.addEventListener('DOMContentLoaded', async () => {
  const data = await loadData();
  if (data) {
    render(data);
    observeAll();
    bindCarousels();
    document.querySelectorAll('#home .reveal').forEach((el,i) => {
      setTimeout(() => el.classList.add('visible'), i*130+80);
    });
  }
  document.getElementById('loadingScreen').classList.add('hidden');
});
</script>
